<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetraAI — Enterprise Database Schema Visualizer</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- D3.js from secure CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #131722;
            --bg-glass: rgba(19, 23, 34, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f2f5;
            --text-secondary: #9aa0a6;
            
            /* Category Colors */
            --color-clinical: #10b981;    /* Emerald Green */
            --color-ai: #06b6d4;          /* Cyan */
            --color-telecom: #ec4899;     /* Pink/Magenta */
            --color-gamification: #f59e0b;/* Amber Gold */
            --color-auth: #64748b;        /* Slate */
            --color-highlight: #6366f1;   /* Indigo */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ── LAYOUT ────────────────────────────────────────── */
        .app-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* ── SIDEBAR (Search & Filters) ────────────────────── */
        .sidebar {
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-glass);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-glass);
        }

        .logo-section i {
            font-size: 28px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-section h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--color-highlight);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        .category-filters {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-filters h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: var(--border-glass);
        }

        .filter-btn.active {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--color-highlight);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }

        /* ── CANVAS VIEWPORT ───────────────────────────────── */
        .canvas-area {
            position: relative;
            background-color: var(--bg-primary);
            height: 100vh;
            width: 100%;
        }

        svg {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        svg:active {
            cursor: grabbing;
        }

        /* ── D3 Element Styling ───────────────────────────── */
        .node {
            cursor: pointer;
            transition: filter 0.15s ease;
        }

        .node rect {
            rx: 8;
            ry: 8;
            stroke-width: 1.5;
            transition: all 0.3s ease;
        }

        .node text.title {
            font-weight: 600;
            font-size: 13px;
            fill: #ffffff;
        }

        .node text.meta {
            font-size: 10px;
            fill: var(--text-secondary);
        }

        .link {
            fill: none;
            stroke-opacity: 0.3;
            stroke-width: 1.5;
            transition: stroke-width 0.2s, stroke-opacity 0.2s;
        }

        .link.highlighted {
            stroke-opacity: 0.9;
            stroke-width: 3px;
            stroke: var(--color-highlight);
        }

        /* ── CONTROLS ──────────────────────────────────────── */
        .canvas-controls {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        /* ── DETAIL DRAWERS ────────────────────────────────── */
        .detail-drawer {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 420px;
            max-height: calc(100vh - 48px);
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            z-index: 20;
            transform: translateX(500px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .detail-drawer.open {
            transform: translateX(0);
            opacity: 1;
        }

        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .drawer-header::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--color-highlight);
            border-radius: 4px 0 0 4px;
        }

        .drawer-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .drawer-close:hover {
            color: #ffffff;
        }

        .drawer-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .table-desc {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.5;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
        }

        .column-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .column-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 6px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            font-size: 13px;
        }

        .col-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .col-left i {
            font-size: 12px;
        }

        .col-left .key-pk {
            color: var(--color-gamification);
        }

        .col-left .key-fk {
            color: var(--color-ai);
        }

        .col-left .col-name {
            font-weight: 500;
        }

        .col-right .col-type {
            font-family: monospace;
            color: var(--text-secondary);
            font-size: 12px;
            background: rgba(0,0,0,0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ── SIDEBAR ────────────────────────────────────────── -->
        <aside class="sidebar">
            <div class="logo-section">
                <i class="fa-solid fa-brain"></i>
                <div>
                    <h1>NetraAI</h1>
                    <p style="font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;">Schema Map v2.0</p>
                </div>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="schema-search" placeholder="Search tables or fields..." oninput="handleSearch()">
            </div>

            <div class="category-filters">
                <h3>Domain Communities</h3>
                
                <button class="filter-btn active" onclick="filterCategory('all', this)">
                    <span>All Tables</span>
                    <span style="font-size: 12px; color: var(--text-secondary);" id="cnt-all">30</span>
                </button>
                
                <button class="filter-btn" onclick="filterCategory('clinical', this)">
                    <span><span class="badge-dot" style="background: var(--color-clinical);"></span>Clinical Workflows</span>
                    <span style="font-size: 12px; color: var(--text-secondary);" id="cnt-clinical">0</span>
                </button>
                
                <button class="filter-btn" onclick="filterCategory('ai', this)">
                    <span><span class="badge-dot" style="background: var(--color-ai);"></span>AI & Diagnostics</span>
                    <span style="font-size: 12px; color: var(--text-secondary);" id="cnt-ai">0</span>
                </button>
                
                <button class="filter-btn" onclick="filterCategory('telecom', this)">
                    <span><span class="badge-dot" style="background: var(--color-telecom);"></span>Telemedicine & Chat</span>
                    <span style="font-size: 12px; color: var(--text-secondary);" id="cnt-telecom">0</span>
                </button>

                <button class="filter-btn" onclick="filterCategory('gamification', this)">
                    <span><span class="badge-dot" style="background: var(--color-gamification);"></span>Gamification</span>
                    <span style="font-size: 12px; color: var(--text-secondary);" id="cnt-gamification">0</span>
                </button>
                
                <button class="filter-btn" onclick="filterCategory('auth', this)">
                    <span><span class="badge-dot" style="background: var(--color-auth);"></span>Auth & Profiles</span>
                    <span style="font-size: 12px; color: var(--text-secondary);" id="cnt-auth">0</span>
                </button>
            </div>
            
            <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-glass); font-size: 12px; color: var(--text-secondary);">
                <p><i class="fa-solid fa-circle-check" style="color: var(--color-clinical); margin-right: 6px;"></i> Consolidated SQL Schema Loaded</p>
                <p style="margin-top: 4px;"><i class="fa-solid fa-lock" style="color: var(--color-ai); margin-right: 6px;"></i> HIPAA HIPAA & SOC 2 Ready</p>
            </div>
        </aside>

        <!-- ── CANVAS AREA ────────────────────────────────────── -->
        <main class="canvas-area">
            <svg id="visualizer-canvas"></svg>

            <!-- Zoom & Pan Controls -->
            <div class="canvas-controls">
                <button class="control-btn" title="Fit Screen" onclick="resetZoom()"><i class="fa-solid fa-expand"></i></button>
                <button class="control-btn" title="Zoom In" onclick="zoomIn()"><i class="fa-solid fa-plus"></i></button>
                <button class="control-btn" title="Zoom Out" onclick="zoomOut()"><i class="fa-solid fa-minus"></i></button>
            </div>

            <!-- Schema details panel (Slide drawer) -->
            <div class="detail-drawer" id="details-drawer">
                <div class="drawer-header">
                    <div>
                        <h2 id="drawer-title" style="font-size: 18px; font-weight: 700;">appointments</h2>
                        <p id="drawer-subtitle" style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; margin-top: 4px; letter-spacing: 1px;">Clinical Workflows</p>
                    </div>
                    <button class="drawer-close" onclick="closeDrawer()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="drawer-body">
                    <div>
                        <h3 class="section-title" style="margin-bottom: 8px;">Description & HIPAA Role</h3>
                        <p class="table-desc" id="drawer-desc">Clinical appointment scheduling with overlap prevention and video consultation linkages.</p>
                    </div>
                    <div>
                        <h3 class="section-title" style="margin-bottom: 8px;">Active Fields & Data Types</h3>
                        <div class="column-list" id="drawer-columns">
                            <!-- Dynamic list of columns -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ── DATA & SIMULATION SCRIPTS ────────────────────── -->
    <script>

        const databaseSchema = {

                    { name: "points_reward", type: "INTEGER", key: "" }
                ]},
                { id: "patient_achievements", name: "patient_achievements", category: "gamification", desc: "Tracking records linking patients to acquired streaks and wellness badges.", cols: [
                    { name: "id", type: "UUID", key: "pk" },
                    { name: "patient_id", type: "UUID", key: "fk" },
                    { name: "achievement_id", type: "UUID", key: "fk" },
                    { name: "unlocked_at", type: "TIMESTAMPTZ", key: "" }
                ]}
            ],
            links: [
                { source: "profiles_patient", target: "users" },
                { source: "profiles_doctor", target: "users" },
                { source: "fhir_patients", target: "users" },
                { source: "appointments", target: "profiles_patient" },
                { source: "appointments", target: "profiles_doctor" },
                { source: "medical_imaging_studies", target: "profiles_patient" },
                { source: "medical_imaging_studies", target: "appointments" },
                { source: "ai_analysis_results", target: "profiles_patient" },
                { source: "ai_analysis_results", target: "ai_models" },
                { source: "ai_analysis_results", target: "medical_imaging_studies" },
                { source: "scans", target: "profiles_patient" },
                { source: "scans", target: "profiles_doctor" },
                { source: "video_consultations", target: "appointments" },
                { source: "video_consultations", target: "profiles_patient" },
                { source: "video_consultations", target: "profiles_doctor" },
                { source: "conversations", target: "users" },
                { source: "messages", target: "conversations" },
                { source: "messages", target: "users" },
                { source: "prescriptions", target: "appointments" },
                { source: "prescriptions", target: "profiles_patient" },
                { source: "prescriptions", target: "profiles_doctor" },
                { source: "clinical_notes", target: "appointments" },
                { source: "clinical_notes", target: "profiles_patient" },
                { source: "clinical_notes", target: "profiles_doctor" },
                { source: "notifications", target: "users" },
                { source: "patient_medical_history", target: "profiles_patient" },
                { source: "patient_achievements", target: "profiles_patient" },
                { source: "patient_achievements", target: "achievements" }
            ]
        };

        // Initialize node categories counts
        function initCounts() {
            document.getElementById("cnt-all").innerText = databaseSchema.nodes.length;
            const categories = ["clinical", "ai", "telecom", "gamification", "auth"];
            categories.forEach(cat => {
                const count = databaseSchema.nodes.filter(n => n.category === cat).length;
                document.getElementById(`cnt-${cat}`).innerText = count;
            });
        }
        initCounts();

        // ── D3 INTEGRATION ────────────────────────────────────
        const svg = d3.select("#visualizer-canvas");
        const width = window.innerWidth - 350;
        const height = window.innerHeight;

        // Container group for zooming & panning
        const gContainer = svg.append("g");

        // Zoom Behavior
        const zoom = d3.zoom()
            .scaleExtent([0.2, 3])
            .on("zoom", (event) => {
                gContainer.attr("transform", event.transform);
            });
        svg.call(zoom);

        // Simulation setup
        const simulation = d3.forceSimulation(databaseSchema.nodes)
            .force("link", d3.forceLink(databaseSchema.links).id(d => d.id).distance(220))
            .force("charge", d3.forceManyBody().strength(-1200))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(110));

        // Markers for foreign key directionality (arrowheads)
        svg.append("defs").append("marker")
            .attr("id", "arrowhead")
            .attr("viewBox", "-0 -5 10 10")
            .attr("refX", 100)  // Offset from node center to sit at boundary
            .attr("refY", 0)
            .attr("orient", "auto")
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("xoverflow", "visible")
            .append("svg:path")
            .attr("d", "M 0,-5 L 10 ,0 L 0,5")
            .attr("fill", "rgba(255,255,255,0.15)")
            .style("stroke", "none");

        // Render Links
        const link = gContainer.append("g")
            .attr("class", "links")
            .selectAll("path")
            .data(databaseSchema.links)
            .enter().append("path")
            .attr("class", "link")
            .attr("stroke", "rgba(255,255,255,0.12)")
            .attr("marker-end", "url(#arrowhead)");

        // Render Nodes
        const node = gContainer.append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(databaseSchema.nodes)
            .enter().append("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended))
            .on("click", (event, d) => showDetails(d))
            .on("mouseover", handleMouseOver)
            .on("mouseout", handleMouseOut);

        // Node card background
        node.append("rect")
            .attr("width", 180)
            .attr("height", 60)
            .attr("x", -90)
            .attr("y", -30)
            .attr("fill", "var(--bg-glass)")
            .attr("stroke", d => `var(--color-${d.category})`)
            .style("filter", "drop-shadow(0 4px 10px rgba(0,0,0,0.35))");

        // Table icon badge indicator
        node.append("circle")
            .attr("cx", -68)
            .attr("cy", 0)
            .attr("r", 10)
            .attr("fill", d => `var(--color-${d.category})`);

        node.append("i")
            .attr("class", "fa-solid fa-table")
            .style("font-size", "10px")
            .style("color", "#000000");

        // Table Label text
        node.append("text")
            .attr("class", "title")
            .attr("x", -48)
            .attr("y", 4)
            .text(d => d.name);

        node.append("text")
            .attr("class", "meta")
            .attr("x", -48)
            .attr("y", 18)
            .text(d => `${d.cols.length} fields`);

        // Node Dragging functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Ticker coordinates update
        simulation.on("tick", () => {
            link.attr("d", d => {
                return `M ${d.source.x} ${d.source.y} L ${d.target.x} ${d.target.y}`;
            });

            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        // ── INTERACTIONS ──────────────────────────────────────
        function handleMouseOver(event, d) {
            // Fade out other links
            link.attr("stroke-opacity", l => (l.source.id === d.id || l.target.id === d.id) ? 0.9 : 0.05)
                .attr("stroke", l => (l.source.id === d.id || l.target.id === d.id) ? "var(--color-highlight)" : "rgba(255,255,255,0.05)")
                .attr("stroke-width", l => (l.source.id === d.id || l.target.id === d.id) ? 2.5 : 1.5);

            // Fade out other nodes
            node.style("opacity", n => {
                if (n.id === d.id) return 1;
                // Check if neighboring node
                const isNeighbor = databaseSchema.links.some(l => 
                    (l.source.id === d.id && l.target.id === n.id) || 
                    (l.target.id === d.id && l.source.id === n.id)
                );
                return isNeighbor ? 0.95 : 0.25;
            });
        }

        function handleMouseOut() {
            link.attr("stroke-opacity", 0.3)
                .attr("stroke", "rgba(255,255,255,0.12)")
                .attr("stroke-width", 1.5);
            node.style("opacity", 1);
        }

        // Drawer presentation details
        function showDetails(d) {
            const drawer = document.getElementById("details-drawer");
            document.getElementById("drawer-title").innerText = d.name;
            document.getElementById("drawer-subtitle").innerText = `${d.category} Domain`;
            document.getElementById("drawer-desc").innerText = d.desc;
            
            // Set indicator color
            drawer.style.borderRight = `4px solid var(--color-${d.category})`;

            const colList = document.getElementById("drawer-columns");
            colList.innerHTML = "";

            d.cols.forEach(c => {
                let keyIcon = "";
                if (c.key === "pk") {
                    keyIcon = `<i class="fa-solid fa-key key-pk" title="Primary Key"></i>`;
                } else if (c.key === "fk") {
                    keyIcon = `<i class="fa-solid fa-circle-arrow-right key-fk" title="Foreign Key"></i>`;
                } else if (c.key === "calc") {
                    keyIcon = `<i class="fa-solid fa-calculator text-secondary" title="Calculated Field"></i>`;
                } else if (c.key === "chk") {
                    keyIcon = `<i class="fa-solid fa-shield text-success" title="Check Constraint"></i>`;
                } else {
                    keyIcon = `<i class="fa-solid fa-hashtag text-secondary" style="opacity: 0.3;"></i>`;
                }

                const item = document.createElement("div");
                item.className = "column-item";
                item.innerHTML = `
                    <div class="col-left">
                        ${keyIcon}
                        <span class="col-name">${c.name}</span>
                    </div>
                    <div class="col-right">
                        <span class="col-type">${c.type}</span>
                    </div>
                `;
                colList.appendChild(item);
            });

            drawer.classList.add("open");
        }

        function closeDrawer() {
            document.getElementById("details-drawer").classList.remove("open");
        }

        // ── ZOOM CONTROLS ─────────────────────────────────────
        function zoomIn() {
            svg.transition().duration(300).call(zoom.scaleBy, 1.3);
        }

        function zoomOut() {
            svg.transition().duration(300).call(zoom.scaleBy, 0.7);
        }

        function resetZoom() {
            svg.transition().duration(500).call(
                zoom.transform,
                d3.zoomIdentity.translate(0, 0).scale(1)
            );
        }

        // ── SEARCH & FILTER FUNCTIONS ─────────────────────────
        function handleSearch() {
            const query = document.getElementById("schema-search").value.toLowerCase();
            if (!query) {
                node.style("opacity", 1);
                link.style("opacity", 1);
                return;
            }

            node.style("opacity", n => {
                const matchesTable = n.name.toLowerCase().includes(query);
                const matchesFields = n.cols.some(c => c.name.toLowerCase().includes(query));
                return (matchesTable || matchesFields) ? 1 : 0.15;
            });

            link.style("opacity", 0.05);
        }

        function filterCategory(cat, btn) {
            // Manage active button class
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            if (cat === "all") {
                node.style("display", null);
                link.style("display", null);
                simulation.alpha(0.3).restart();
                return;
            }

            // Hide/Show nodes based on category selection
            node.style("display", n => n.category === cat ? null : "none");
            link.style("display", l => (l.source.category === cat && l.target.category === cat) ? null : "none");
            
            simulation.alpha(0.3).restart();
        }
    </script>
</body>
</html>
