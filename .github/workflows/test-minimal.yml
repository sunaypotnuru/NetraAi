name: Test - Minimal Workflow

on:
  push:
    branches: [main]

jobs:
  test-basic:
    name: Basic Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Echo test
        run: echo "GitHub Actions is working!"
      
      - name: List files
        run: ls -la
      
      - name: Check Python version
        run: python --version
      
      - name: Check Node version
        run: node --version
